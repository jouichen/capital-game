<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 環球首都特訓班 - 獨立挑戰版</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            margin: 0;
            padding: 20px;
            background-color: #eef2f7; /* 海洋輕藍色 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 12px 36px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
            position: relative;
            text-align: center;
            overflow: hidden;
        }

        #score-board {
            font-size: 18px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px;
        }

        #instruction {
            font-size: 20px;
            font-weight: bold;
            color: #0f172a;
            margin: 16px 0;
            min-height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f1f5f9;
            border-radius: 16px;
            padding: 12px;
            border: 1px dashed #cbd5e1;
            line-height: 1.4;
        }

        #timer-container {
            width: 100%;
            height: 8px;
            background-color: #e2e8f0;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
            display: none;
        }

        #timer-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #1d4ed8); /* 科技藍條 */
            transition: width 0.1s linear;
        }

        #stage {
            width: 100%;
            height: 380px;
            background-color: #f8fafc;
            border-radius: 20px;
            position: relative;
            border: 1px solid #e2e8f0;
            background-image: radial-gradient(#94a3b8 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* 頂層主選單 */
        #menu-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        /* 區域選擇選單 */
        #sub-menu-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 11;
        }

        h3 {
            margin-top: 0;
            color: #0f172a;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .mode-btn {
            width: 85%;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .btn-toddler { background-color: #475569; } /* 經典鐵灰藍 */
        .btn-child   { background-color: #2563eb; } /* 挑戰皇家藍 */
        .btn-senior  { background-color: #0d9488; } /* 懷舊樂活綠 */

        .back-btn {
            margin-top: 16px;
            background-color: #64748b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 🏠 回首頁按鈕 */
        #home-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 15;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #cbd5e1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* 飛出的城市膠囊 */
        #game-object {
            position: absolute;
            display: none;
            cursor: pointer;
            user-select: none;
            font-weight: bold;
            background: white;
            padding: 12px 18px;
            border-radius: 50px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.15);
            border: 2px solid #3b82f6;
            color: #0f172a;
            white-space: nowrap;
        }

        /* 分數動畫 */
        .floating-text {
            position: absolute;
            font-size: 26px;
            font-weight: bold;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 20;
        }

        .plus { color: #10b981; text-shadow: 1px 1px 0 white; }
        .minus { color: #ef4444; text-shadow: 1px 1px 0 white; }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            100% { transform: translateY(-45px) scale(1.2); opacity: 0; }
        }

        #restart-btn {
            margin-top: 15px;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-board">
            <div>得分: <span id="score">0</span></div>
            <div id="level-indicator" style="font-size: 13px; color: #ef4444; font-weight: bold;"></div>
        </div>
        <div id="instruction">🌍 環球首都特訓班 🌍</div>
        
        <div id="timer-container"><div id="timer-bar"></div></div>
        
        <div id="stage">
            <button id="home-btn" onclick="showMenu()">🏠</button>

            <div id="menu-overlay">
                <h3>🌍 請選擇特訓難度</h3>
                <button class="mode-btn btn-toddler" onclick="selectMode('TODDLER')">👶 基礎班 (認識正統首都)</button>
                <button class="mode-btn btn-child" onclick="selectMode('CHILD')">⚡ 進階班 (限時陣營大混戰)</button>
                <button class="mode-btn btn-senior" onclick="selectMode('SENIOR')">👵 養生班 (樂活記憶慢速流)</button>
            </div>
            
            <div id="sub-menu-overlay" style="display:none;">
                <h3 id="sub-menu-title">請選擇特訓區域</h3>
                <div id="theme-buttons-container"></div>
                <button class="back-btn" onclick="showMenu()">⬅ 返回重選難度</button>
            </div>
            
            <div id="game-object"></div>
        </div>
        <button id="restart-btn" style="display:none;" onclick="showMenu()">返回主選單</button>
    </div>
    <script src="game.js"></script>
</body>
</html>
