<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>🌍 環球首都特訓班 - 獨立挑戰版</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            margin: 0;
            padding: 10px;
            background-color: #eef2f7; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 12px 36px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
            position: relative;
            text-align: center;
            overflow: hidden;
        }

        #score-board {
            font-size: 18px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        #instruction {
            font-size: 16px;
            font-weight: bold;
            color: #0f172a;
            margin: 10px 0;
            min-height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f1f5f9;
            border-radius: 14px;
            padding: 8px 12px;
            border: 1px dashed #cbd5e1;
            line-height: 1.4;
        }

        #timer-container {
            width: 100%;
            height: 8px;
            background-color: #e2e8f0;
            border-radius: 4px;
            margin-bottom: 12px;
            overflow: hidden;
            display: none;
        }

        #timer-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #1d4ed8);
            transition: width 0.1s linear;
        }

        #stage {
            width: 100%;
            height: 380px;
            background-color: #f8fafc;
            border-radius: 20px;
            position: relative;
            border: 1px solid #e2e8f0;
            background-image: radial-gradient(#94a3b8 1px, transparent 1px);
            background-size: 20px 20px;
            overflow: hidden; /* 防止字體隨機到太邊緣時撐開網頁 */
        }

        #menu-overlay, #sub-menu-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 10;
        }

        #sub-menu-overlay {
            background-color: rgba(255, 255, 255, 0.98);
            z-index: 11;
        }

        h3 {
            margin-top: 0;
            color: #0f172a;
            font-size: 20px;
            margin-bottom: 16px;
        }

        .mode-btn {
            width: 90%;
            padding: 12px 16px;
            margin: 6px 0;
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }

        .btn-toddler { background-color: #475569; }
        .btn-child   { background-color: #2563eb; }
        .btn-senior  { background-color: #0d9488; }

        .back-btn {
            margin-top: 14px;
            background-color: #64748b;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        #home-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 15;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #cbd5e1;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 📱 核心修正：手機專用彈性膠囊（防爆框、防遮擋） */
        #game-object {
            position: absolute;
            display: none;
            cursor: pointer;
            user-select: none;
            font-weight: bold;
            background: white;
            padding: 10px 14px;
            border-radius: 30px;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.15);
            border: 2px solid #3b82f6;
            color: #0f172a;
            
            /* 以下屬性確保文字在任何手機都不會爆框 */
            max-width: 90%; 
            white-space: nowrap; 
            overflow: hidden;
            text-overflow: ellipsis;
            box-sizing: border-box;
        }

        .floating-text {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 20;
        }

        .plus { color: #10b981; text-shadow: 1px 1px 0 white; }
        .minus { color: #ef4444; text-shadow: 1px 1px 0 white; }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            100% { transform: translateY(-40px) scale(1.1); opacity: 0; }
        }

        #restart-btn {
            margin-top: 12px;
            padding: 10px 24px;
            font-size: 15px;
            font-weight: bold;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-board">
            <div>得分: <span id="score">0</span></div>
            <div id="level-indicator" style="font-size: 12px; color: #ef4444; font-weight: bold;"></div>
        </div>
        <div id="instruction">🌍 環球首都特訓班 🌍</div>
        
        <div id="timer-container"><div id="timer-bar"></div></div>
        
        <div id="stage">
            <button id="home-btn" onclick="showMenu()">🏠</button>

            <div id="menu-overlay">
                <h3>🌍 請選擇特訓難度</h3>
                <button class="mode-btn btn-toddler" onclick="selectMode('TODDLER')">👶 基礎班 (認識正統首都)</button>
                <button class="mode-btn btn-child" onclick="selectMode('CHILD')">⚡ 進階班 (限時陣營大混戰)</button>
                <button class="mode-btn btn-senior" onclick="selectMode('SENIOR')">👵 養生班 (樂活記憶慢速流)</button>
            </div>
            
            <div id="sub-menu-overlay" style="display:none;">
                <h3 id="sub-menu-title">請選擇特訓區域</h3>
                <div id="theme-buttons-container" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
                <button class="back-btn" onclick="showMenu()">⬅ 返回重選難度</button>
            </div>
            
            <div id="game-object"></div>
        </div>
        <button id="restart-btn" style="display:none;" onclick="showMenu()">返回主選單</button>
    </div>
    <script src="game.js"></script>
</body>
</html>
